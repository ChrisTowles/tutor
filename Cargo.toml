[workspace]
resolver = "3"
members = ["crates/proto", "crates/telemetry", "crates/station", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tutor-proto = { path = "crates/proto" }
tutor-telemetry = { path = "crates/telemetry" }
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
crossbeam-channel = "0.5"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[profile.release]
debug = 1
